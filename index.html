<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Park TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="sp-frame" src="https://southparkstudios.com.br" allowfullscreen></iframe>

    <script>
        // Garante que o iframe receba o foco do controle remoto assim que abrir
        const iframe = document.getElementById('sp-frame');
        window.addEventListener('load', () => {
            iframe.focus();
        });

        // Mapeamento básico para garantir que as setas do controle funcionem dentro do site
        window.addEventListener('keydown', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(event.key)) {
                iframe.contentWindow.postMessage({ type: 'TV_KEY', key: event.key }, '*');
            }
        });
    </script>
</body>
</html>
