name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova and Build Project
        run: |
          npm install -g cordova
          # Cria um projeto limpo do Cordova
          cordova create my-app com.edsonolive.southparktv "South Park TV"
          # Copia as configurações e a página que você criou para dentro do projeto
          cp config.xml my-app/config.xml
          cp index.html my-app/www/index.html
          cd my-app
          # Adiciona a plataforma Android e compila
          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: south-park-tv-apk
          path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
